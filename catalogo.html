<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8f668f">
  <title>Catalogo | Taller de Costura Marbelly</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #302839;
      --muted: #706879;
      --line: #e6dce2;
      --surface: #ffffff;
      --blush: #c77f91;
      --plum: #76528e;
      --plum-dark: #563868;
      --soft: #fbf7f5;
      --shadow: 0 18px 44px rgba(72, 49, 80, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(180deg, rgba(253, 248, 246, 0.96), rgba(245, 238, 241, 0.96)),
        #fbf7f5;
      color: var(--ink);
    }

    .page {
      width: min(100%, 520px);
      margin: 0 auto;
      padding: 18px 14px 30px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .back-link,
    .whatsapp-link,
    .carousel-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 999px;
      font: inherit;
      font-weight: 800;
      text-decoration: none;
      touch-action: manipulation;
      cursor: pointer;
    }

    .back-link {
      min-height: 40px;
      padding: 0 13px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--plum-dark);
      border: 1px solid var(--line);
    }

    .brand {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 820;
      text-align: right;
    }

    .hero {
      padding: 0 4px 16px;
    }

    h1 {
      margin: 0;
      color: var(--plum-dark);
      font-size: clamp(2.1rem, 10vw, 3.4rem);
      line-height: 0.98;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .hero p {
      margin: 11px 0 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.45;
    }

    .carousel {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .track {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .track::-webkit-scrollbar {
      display: none;
    }

    .slide {
      position: relative;
      min-width: 100%;
      scroll-snap-align: start;
      background: var(--soft);
    }

    .slide img {
      display: block;
      width: 100%;
      aspect-ratio: 1122 / 1402;
      object-fit: cover;
    }

    .whatsapp-panel {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 18px;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }

    .whatsapp-link {
      min-height: 48px;
      padding: 0 18px;
      background: #128c7e;
      color: #fff;
      box-shadow: 0 13px 26px rgba(18, 140, 126, 0.28);
      pointer-events: auto;
    }

    .whatsapp-link:active,
    .carousel-button:active,
    .back-link:active {
      transform: translateY(1px);
    }

    .whatsapp-link svg,
    .back-link svg,
    .carousel-button svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
    }

    .carousel-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 14px;
    }

    .carousel-button {
      width: 46px;
      height: 46px;
      background: var(--plum);
      color: #fff;
      box-shadow: 0 10px 20px rgba(118, 82, 142, 0.24);
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .dot {
      width: 9px;
      height: 9px;
      border: 0;
      border-radius: 999px;
      background: #d8c8d2;
      cursor: pointer;
      padding: 0;
    }

    .dot.is-active {
      width: 24px;
      background: var(--blush);
    }

    .footer-actions {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .footer-actions .whatsapp-link {
      width: 100%;
    }

    @media (min-width: 700px) {
      body {
        display: grid;
        place-items: center;
      }

      .page {
        padding-block: 34px;
      }
    }

    @media (max-width: 360px) {
      .brand {
        display: none;
      }

      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <a class="back-link" href="index.html" aria-label="Volver a cuentas de pago">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Cuentas
      </a>
      <p class="brand">Taller de Costura Marbelly</p>
    </div>

    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">Catalogo de trabajos</h1>
      <p>Ideas de confecciones, arreglos y detalles personalizados hechos a mano.</p>
    </section>

    <section class="carousel" aria-label="Catalogo de trabajos">
      <div class="track" id="catalog-track">
        <article class="slide">
          <img src="productos/CAT-TRABAJOS%201.png" alt="Catalogo de trabajos 1 de 6">
        </article>
        <article class="slide">
          <img src="productos/CAT-TRABAJOS%202.png" alt="Catalogo de trabajos 2 de 6">
        </article>
        <article class="slide">
          <img src="productos/CAT-TRABAJOS%203.png" alt="Catalogo de trabajos 3 de 6">
        </article>
        <article class="slide">
          <img src="productos/CAT-TRABAJOS%204.png" alt="Catalogo de trabajos 4 de 6">
        </article>
        <article class="slide">
          <img src="productos/CAT-TRABAJOS%205.png" alt="Catalogo de trabajos 5 de 6">
        </article>
        <article class="slide">
          <img src="productos/CAT-TRABAJOS%206.png" alt="Catalogo de trabajos 6 de 6">
          <div class="whatsapp-panel">
            <a class="whatsapp-link" href="https://wa.me/50576670310?text=Hola%2C%20quisiera%20cotizar%20un%20trabajo%20de%20costura." target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
                <path d="M7.2 19.1 4 20l.9-3.1A8.1 8.1 0 1 1 7.2 19.1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                <path d="M9.2 8.8c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.7 1.6c.1.3.1.5-.1.7l-.4.5c.7 1.2 1.7 2.1 3 2.7l.5-.6c.2-.2.4-.3.7-.2l1.6.7c.3.1.4.3.4.6v.5c0 .4-.2.6-.5.8-.5.3-1.3.5-2.3.2-2.9-.8-5.2-3.1-6-6-.3-.9-.1-1.7.2-2.2Z" fill="currentColor"/>
              </svg>
              Escribir por WhatsApp
            </a>
          </div>
        </article>
      </div>
    </section>

    <div class="carousel-nav" aria-label="Controles del catalogo">
      <button class="carousel-button" type="button" data-direction="-1" aria-label="Trabajo anterior">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
          <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="dots" aria-label="Paginas del catalogo"></div>
      <button class="carousel-button" type="button" data-direction="1" aria-label="Trabajo siguiente">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
          <path d="M9 18l6-6-6-6" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div class="footer-actions">
      <a class="whatsapp-link" href="https://wa.me/50576670310?text=Hola%2C%20quisiera%20cotizar%20un%20trabajo%20de%20costura." target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none">
          <path d="M7.2 19.1 4 20l.9-3.1A8.1 8.1 0 1 1 7.2 19.1Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M9.2 8.8c.2-.4.4-.4.7-.4h.5c.2 0 .4.1.5.4l.7 1.6c.1.3.1.5-.1.7l-.4.5c.7 1.2 1.7 2.1 3 2.7l.5-.6c.2-.2.4-.3.7-.2l1.6.7c.3.1.4.3.4.6v.5c0 .4-.2.6-.5.8-.5.3-1.3.5-2.3.2-2.9-.8-5.2-3.1-6-6-.3-.9-.1-1.7.2-2.2Z" fill="currentColor"/>
        </svg>
        Cotizar por WhatsApp
      </a>
    </div>
  </main>

  <script>
    const track = document.getElementById("catalog-track");
    const slides = Array.from(track.querySelectorAll(".slide"));
    const dots = document.querySelector(".dots");
    let activeIndex = 0;

    function goToSlide(index) {
      const nextIndex = (index + slides.length) % slides.length;
      activeIndex = nextIndex;
      track.scrollTo({
        left: slides[nextIndex].offsetLeft,
        behavior: "smooth"
      });
      updateDots();
    }

    function updateDots() {
      dots.querySelectorAll(".dot").forEach((dot, index) => {
        dot.classList.toggle("is-active", index === activeIndex);
        dot.setAttribute("aria-current", index === activeIndex ? "true" : "false");
      });
    }

    slides.forEach((_, index) => {
      const dot = document.createElement("button");
      dot.className = "dot";
      dot.type = "button";
      dot.setAttribute("aria-label", `Ver trabajo ${index + 1}`);
      dot.addEventListener("click", () => goToSlide(index));
      dots.appendChild(dot);
    });

    document.querySelectorAll("[data-direction]").forEach((button) => {
      button.addEventListener("click", () => {
        goToSlide(activeIndex + Number(button.dataset.direction));
      });
    });

    track.addEventListener("scroll", () => {
      const slideWidth = track.clientWidth || 1;
      activeIndex = Math.round(track.scrollLeft / slideWidth);
      updateDots();
    }, { passive: true });

    updateDots();
  </script>
</body>
</html>
